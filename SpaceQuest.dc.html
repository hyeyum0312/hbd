    const full = this.renderVals(true).fullDialogue;
    const sameChapter = this._dialogueChapter === this.state.ch;

              this.sprite(SHIP, px, { glow: "rgba(124,231,255,.6)" }))
          )
        : R("div", { style: { position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18 } },
        R("div", { style: { animation: "bob 5s ease-in-out infinite" } }, this.sprite(PLANET, px + 2, { glow: "rgba(255,209,102,.45)" })),
        R("div", { style: { animation: "bob2 3.2s ease-in-out infinite" } }, this.sprite(SHIP, px - 1, { glow: "rgba(124,231,255,.4)" })),
        S.level === 32 ? R("div", { style: { textAlign: "center", fontFamily: "'Press Start 2P',monospace", lineHeight: 2, color: "#FFD166", animation: "levelpulse 1.6s ease-in-out infinite" } },
          R("div", { style: { fontSize: "clamp(9px,2.6vw,13px)" } }, "LEVEL 31 → 32"),
          R("div", { style: { fontSize: "clamp(8px,2.2vw,11px)", color: "#FF7BA8" } }, "HAPPY BIRTHDAY, " + name + "!")) : null,
        S.fw > 0 ? R("div", { key: "fw" + S.fw, style: { position: "absolute", inset: 0, pointerEvents: "none" } },
          [[26, 28], [74, 22], [50, 68]].map(([lx, ty], g) => R("div", { key: g, style: { position: "absolute", left: lx + "%", top: ty + "%" } },
            Array.from({ length: 12 }).map((_, i) => {
              const a = (i / 12) * Math.PI * 2, d = 46 + (g % 2) * 18;
              return R("span", { key: i, style: {
                position: "absolute", width: 5, height: 5,
                background: ["#FFD166", "#7CE7FF", "#FF7BA8", "#E8EEFB"][(i + g) % 4],
                "--tx": Math.cos(a) * d + "px", "--ty": Math.sin(a) * d + "px",
                animation: "burst 1.1s ease-out " + (g * 0.45).toFixed(2) + "s forwards"
              } });
            })))) : null,
        S.burst > 0 ? R("div", { key: S.burst, style: { position: "absolute", left: "50%", top: "46%", pointerEvents: "none" } },
          Array.from({ length: 22 }).map((_, i) => {
            const a = (i / 22) * Math.PI * 2, d = 90 + (i % 4) * 34;
            return R("span", {
              key: i,
              style: {
                position: "absolute", width: 6, height: 6,
                background: ["#FFD166", "#7CE7FF", "#FF7BA8", "#E8EEFB"][i % 4],
                "--tx": Math.cos(a) * d + "px", "--ty": Math.sin(a) * d + "px",
                animation: "burst " + (0.9 + (i % 5) * 0.12).toFixed(2) + "s ease-out forwards"
              }
            });
          })) : null
      );
      if (S.birthdayLog) { sceneLabel = "PLAYER 지운 · EARTH"; scene = this.memoryScene(-1); }
    } else if (S.ch === "memory") {
      sceneLabel = MEMORY[S.memoryPhase].id === "office" ? "FIRST ENCOUNTER · OFFICE" : "EARTH MEMORY · " + MEMORY[S.memoryPhase].hud;
      scene = this.memoryScene(S.memoryPhase);
    } else {
      const P = S.endPhase;
      sceneLabel = P === 0 ? "BIRTHDAY PLANET · CELEBRATION" : "PARTY : " + name + " & " + partner;
      const endingPx = px === 4 ? 7 : 10;
      const gap = (endingPx * (P >= 2 ? 3.2 : 6)) + "px";
      scene = R("div", { "data-ending-characters":2, "data-kiss":P>=2, style: { position:"absolute", inset:0, overflow:"hidden" } },
        R("div", { style:{ position:"absolute", inset:0, background:"radial-gradient(ellipse at 50% 75%,rgba(124,231,255,.13),transparent 65%)" } }),
        P === 0 ? R("div", { style:{position:"absolute",left:0,right:0,top:"12%",textAlign:"center",fontFamily:"'Press Start 2P',monospace",fontSize:"clamp(9px,2.5vw,13px)",color:"#FFD166",animation:"levelpulse 1s ease-in-out infinite"}},"LEVEL 31 → 32") : null,
        [[18,22],[82,31],[28,62],[74,72],[46,14]].map(([left,top],i)=>R("span",{key:"spark"+i,style:{position:"absolute",left:left+"%",top:top+"%",width:i%2?3:5,height:i%2?3:5,background:i%2?"#7CE7FF":"#FFD166",opacity:.45}})),
        R("div", { style:{ position:"absolute", left:"50%", top:"22%", transform:"translateX(-50%)", opacity:.16 } },this.sprite(PLANET,px-1)),
        P === 0 ? R("div", { key:"birthday-fireworks", style:{position:"absolute",inset:0,pointerEvents:"none"} },
          [[23,30],[76,26],[50,49]].map(([x,y],g)=>R("div",{key:g,style:{position:"absolute",left:x+"%",top:y+"%"}},
            Array.from({length:16},(_,i)=>{
              const a=i/16*Math.PI*2,d=42+(i%3)*11;
              return R("span",{key:i,style:{position:"absolute",width:5,height:5,
                background:["#FFD166","#7CE7FF","#FF7BA8"][i%3],
                "--tx":Math.cos(a)*d+"px","--ty":Math.sin(a)*d+"px",
                animation:"burst 1.2s ease-out "+g*.24+"s both"}});
            })))) : null,
        R("div", { style:{position:"absolute",left:0,right:0,bottom:"25%",height:0} },
          R("div",{style:{position:"absolute",left:"50%",bottom:0,
            transform:"translateX(calc(-50% - "+gap+"))",
            transition:"transform .7s ease"}},
            R("div",{style:{transform:P>=2?"rotate(4deg)":"none",transformOrigin:"50% 100%",transition:"transform .8s ease"}},
              this.sprite(HERO,endingPx,{glow:"rgba(255,209,102,.35)"}))),
          R("div",{style:{position:"absolute",left:"50%",bottom:0,opacity:1,
            transform:"translateX(calc(-50% + "+gap+"))",
            transition:"transform 1.5s ease, opacity .4s ease"}},
            R("div",{style:{transform:P>=2?"rotate(-8deg)":"none",transformOrigin:"50% 100%",transition:"transform .8s ease"}},
              this.sprite(GIRL,endingPx,{flip:true,glow:"rgba(255,123,168,.3)"}))),
          P>=2?R("div",{key:"kiss",style:{position:"absolute",left:"50%",bottom:endingPx*13,transform:"translateX(-50%)",color:"#FF7BA8",fontSize:22}},
            R("span",{style:{display:"block",animation:"ending-heart 4.8s ease-in-out infinite"}},"♥")):null
        )
      );
    }

    // ── 대사 / 선택
    let dialogue = SCRIPT[S.ch].lines[S.li] || "", choices = [];
    if (S.ch === "boot") {
      dialogue = S.bootN === 0
        ? "전원을 넣어보자."
        : S.bootN < BOOT.length ? "" : "플레이어 데이터 로드 완료. 퀘스트를 시작할 수 있다.";
      choices = S.bootN === 0
        ? [this.btn("[ POWER ON ]", this.bootStep, "primary")]
        : S.bootN < BOOT.length ? [this.btn("[ SKIP ]", () => this.setState({ bootN: BOOT.length }), "ghost")]
        : [this.btn("[ START BIRTHDAY QUEST ]", () => this.go("space"), "primary")];
    } else if (S.ch === "space") {
      if (S.achStep > 0) {
        dialogue = S.achStep === 1 ? "" : ACHIEVEMENT_LINES[S.achStep - 2];
        choices = S.achStep >= 1 + ACHIEVEMENT_LINES.length
          ? [this.btn("[ 계속 항해 ▶ ]", () => this.go("quantum"), "primary")]
          : [];
      } else if (S.li >= SCRIPT.space.lines.length) {
        const e = ENEMIES[S.killed];
        dialogue = S.combatMessage || "";
        choices = e
          ? [this.btn("[ ATTACK ]", this.fight, "primary"), this.btn("EXP " + S.exp, () => {}, "ghost")]
          : [];
      } else {
        choices = S.spaceIntroAuto
          ? [this.btn("[ ATTACK ]", this.fight, "primary")]
          : [this.btn("▶ NEXT", this.next)];
      }
    } else if (S.ch === "quantum") {
      if (S.li >= 1) {
        dialogue = S.observing ? "OBSERVING..." :
          S.observed ? "WAVE FUNCTION COLLAPSED.\nRESULT : " + S.observed + ".\n무협 읽다가 그대로 잠든 것으로 추정. 역시." :
          "관측하시겠습니까? (관측하면 확정됩니다)";
        choices = S.observing ? [] :
          S.observed ? [this.btn("[ 계속 항해 ]", () => this.go("murim"), "primary")]
          : [this.btn("[ 관측하기 ]", this.observe, "primary")];
      } else {
        choices = [this.btn("▶ NEXT", this.next)];
      }
    } else if (S.ch === "murim") {
      if (S.murimIn) {
        dialogue = "개발계의 고수 지운.\n낮에는 잠을 자고, 밤에는 코드를 짜고,\n새벽에는 무협지를 탐독하며\n수많은 야근의 겁난을 견뎌냈다.\n\n밤낮이 뒤바뀐 삶. 그러나 이것이 그의 수련법이었다.";
        choices = [this.btn("[ 포탈 복귀 ]", () => this.go("planet"), "primary")];
      } else {
        choices = [this.btn("[ YES ]", this.enterMurim), this.btn("[ 당연히 YES ]", this.enterMurim, "primary")];
      }
    } else if (S.ch === "planet") {
      if (S.li >= 2) {
        dialogue = S.birthdayLog
          ? "1994.09.16\nPLAYER 지운이\n지구에 접속한 날."
          : "착륙 완료. 뭔가 올라갈 것 같다.";
        choices = S.birthdayLog
          ? [this.btn("▶ NEXT", () => this.go("memory"), "primary")]
          : [this.btn("▶ NEXT", this.openEarthLog, "primary")];
      } else {
        choices = [this.btn("▶ NEXT", S.li === 0 ? this.startPlanetTravel : this.next)];
      }
    } else if (S.ch === "memory") {
      dialogue = MEMORY[S.memoryPhase].text;
      choices = [this.btn("▶ NEXT", this.advanceMemory, "primary")];
    } else {
      const P = S.endPhase;
      if (P < 3) {
        dialogue = P === 0 ? "MISSION COMPLETE\nLEVEL 31 → LEVEL 32\nHAPPY BIRTHDAY, 지운!" : P === 1 ? "BACK TO PRESENT.\n이제는 함께 접속 중." : "...!";
        choices = P === 2 ? [this.btn("▶ NEXT", this.skipEnding, "primary")] : [];
      } else if (P === 3) {
        dialogue = this.isSample ? "생일 진짜 많이 축하해 ❤️" : "TO. 지운이에게\n\n앞으로도 하고 싶은 거 실컷 하고,\n좋아하는 무협도 실컷 읽고,\n나랑 여행도 많이 다니고,\n\n돈도 많이 벌어서 사랑하는 가족들도 잘 챙기고,\n무엇보다 아프지 말고 건강하게\n나랑 오래오래 같이 놀자.\n\n지운아, 생일 진짜 많이 축하해 ❤️사랑해";
        choices = [this.btn("▶ NEXT", () => {
          this._followDialogue = true;
          this.setState({ endPhase: 5, ended: true, typed: "", dialogueHistory: [] });
        }, "primary")];
      } else {
        dialogue = "다음 생일까지 계속됩니다...\n\nMAIN QUEST UPDATED — " + name + "이 하고 싶은 거 다 하면서 행복하게 살기\nPLAYER : " + name + "  ·  LEVEL : 32\nPARTY MEMBER : " + partner + " ❤️  ·  PARTY STATUS : 함께 모험 중...";
        choices = [this.btn("[ 처음부터 ]", () => (this._ranEnd = 0, this.stopMood(), this.setState({ ch: "boot", li: 0, bootN: 0, killed: 0, exp: 0, combatMessage: "", observed: null, murimIn: false, level: 31, birthdayLog: false, ended: false, achStep: 0, planetTravel: false, driveCaption: "hidden", endPhase: 0, endingBusy: false, fw: 0, memoryPhase: 0, typed: "" })), "ghost")];
      }
    }

    const encounter = S.ch === "space" && S.li >= SCRIPT.space.lines.length &&
      !S.achStep && !S.lastKill && ENEMIES[S.killed];
    const toast = encounter ? R("div", {
      key: encounter.n,
      role: "status",
      style: {
        position: "absolute", bottom: 16, left: "50%", transform: "translateX(-50%)",
        width: "max-content", maxWidth: "calc(100% - 32px)", boxSizing: "border-box",
        border: "2px solid #FFD166", background: "rgba(14,10,2,.94)",
        color: "#FFD166", padding: "10px 14px", textAlign: "center",
        fontFamily: "'IBM Plex Sans KR',sans-serif", fontSize: "clamp(12px,3vw,15px)",
        lineHeight: 1.6, zIndex: 3, pointerEvents: "none"
      }
    }, encounter.n + " 이(가) 나타났다!") : S.lastKill && S.ch === "space" ? R("div", {
      style: {
        position: "absolute", top: 14, right: 14, border: "2px solid #6BE3A8",
        background: "rgba(6,20,16,.9)", color: "#6BE3A8", padding: "8px 12px",
        fontFamily: "'Press Start 2P',monospace", fontSize: 8, animation: "popin .3s both"
      }
    }, "+" + S.lastKill.exp + " EXP") : null;

    const overlay = S.ach ? R("div", {
      style: {
        position: "fixed", left: "50%", bottom: "6vh", transform: "translateX(-50%)", zIndex: 40,
        border: "2px solid #FFD166", background: "rgba(14,10,2,.94)", padding: "14px 18px",
        textAlign: "center", animation: "popin .4s both", maxWidth: "min(92vw,420px)"
      }
    },
      R("div", { style: { fontFamily: "'Press Start 2P',monospace", fontSize: 8, color: "#FFD166", marginBottom: 8 } }, "ACHIEVEMENT UNLOCKED"),
      R("div", { style: { fontFamily: "'Press Start 2P',monospace", fontSize: "clamp(8px,2.4vw,11px)", color: "#E8EEFB", lineHeight: 1.7 } }, S.ach)) : null;

    if (this._forwardHistory.length > 0) {
      choices = [this.btn("▶ NEXT", this.forward, "primary")];
    }

    if (S.ch !== "boot" && this._backHistory.length > 0) {
      choices = [this.btn("◀ BACK", this.back, "ghost")].concat(choices);
    }

    const fullDialogue = dialogue;
    const startReady = S.ch === "boot" && (S.bootN === 0 || S.bootN >= BOOT.length);
    const locked = !startReady && ((S.ch === "space" && S.spaceIntroAuto && S.li < SCRIPT.space.lines.length) || !!this._typing || fullDialogue !== this._dialogueTarget ||
      (!this._reviewing && (S.observing || S.glitch)) ||
      (S.ch === "boot" && S.bootN > 0 && S.bootN < BOOT.length) ||
      (S.ch === "planet" && S.planetTravel) ||
      (!this._reviewing && S.ch === "message" && (S.endPhase < 2 || (S.endPhase === 2 && S.endingBusy))));
    if (!raw) {
      const sameChapter = this._dialogueChapter === S.ch;
      const current = sameChapter && fullDialogue === this._dialogueTarget ? S.typed : "";
      dialogue = [...(sameChapter ? S.dialogueHistory : []), current].filter(Boolean).join("\n\n");
      choices = choices.map(button => React.cloneElement(button, {
        disabled: locked && !button.props["data-interrupt"],
        "aria-disabled": locked && !button.props["data-interrupt"],
        style: { ...button.props.style, opacity: locked && !button.props["data-interrupt"] ? 0.4 : 1,
          cursor: locked && !button.props["data-interrupt"] ? "not-allowed" : "pointer" }
      }));
    }

    const dialogueLog = raw ? null : R("div", {
      role: "region", "aria-label": "현재 챕터 대사 기록", tabIndex: 0,
      style: { fontSize: "clamp(13px,3.4vw,16px)", lineHeight: 1.9,
        whiteSpace: "pre-wrap", minHeight: "5.4em", maxHeight: "32svh",
        overflowY: "auto", overflowWrap: "anywhere", paddingRight: 8,
        overscrollBehavior: "contain", scrollbarGutter: "stable" },
      ref: el => {
        if (el && this._followDialogue !== false) el.scrollTop = el.scrollHeight;
      },
      onScroll: event => {
        const el = event.currentTarget;
        this._followDialogue = el.scrollHeight - el.scrollTop - el.clientHeight < 32;
      }
    }, dialogue);

    return {
      fullDialogue, locked, dialogueLog,
      playerName: name, level: S.level,
      hpBar: this.bar(S.ch === "message" ? 10 : 8, 10, "#6BE3A8"),
      coffeeBar: this.bar(S.coffee, 8, "#FFD166"),
      sleepLabel: S.ch === "message" ? "OK" : "LOW",
      sceneLabel, scene, toast, overlay, dialogue,
      chapterLabel: SCRIPT[S.ch].label,
      choices
    };
  }
}
</script>
</body>
</html>
